<div class="min-h-screen bg-[#11100e] text-[#e6dfd5] font-serif selection:bg-[#d4af37] selection:text-black">
  <main class="max-w-6xl mx-auto px-4">
    
    <!-- 1. شاشة البداية: بتملى الشاشة كلها وبتحتوي على زرار الاسكرول لوحده في النص -->
    <section class="h-screen flex flex-col items-center justify-center">
      <app-scroll-down></app-scroll-down>
    </section>

    <!-- 2. قسم الـ Hero: بيبدأ بعد الشاشة الأولى (مش هيبان غير لما تعمل Scroll) -->
    <div appScrollAnimate class="min-h-screen flex flex-col justify-center py-20">
      <app-hero></app-hero>
    </div>

    <!-- 3. باقي الأقسام بالتسلسل -->
    <div appScrollAnimate class="py-24">
      <app-countdown></app-countdown>
    </div>
    
    <div appScrollAnimate class="py-24">
      <app-venue></app-venue>
    </div>
    
    <div appScrollAnimate class="py-24">
      <app-wedding-timeline></app-wedding-timeline>
    </div>
    
    <div appScrollAnimate class="py-24">
      <app-memories></app-memories>
    </div>
    
    <div appScrollAnimate class="py-24">
      <app-blessing></app-blessing>
    </div>

  </main>
</div>
