<div class="py-12 px-4 max-w-3xl mx-auto text-center" #blessingCard dir="rtl">
    
    <!-- كارد الدعاء المبارك -->
    <div class="bg-[#171512] border border-[#d4af37]/40 rounded-3xl p-8 md:p-12 shadow-2xl relative overflow-hidden group hover:border-[#d4af37] transition-all duration-500">
      
      <!-- إضاءة خفيفة خلفية تزيد من فخامة الكارد -->
      <div class="absolute inset-0 bg-gradient-to-t from-[#d4af37]/5 via-transparent to-transparent opacity-50 pointer-events-none"></div>

      <!-- أيقونة تعبيرية ذهبية -->
      <div class="w-16 h-16 mx-auto mb-6 rounded-2xl bg-[#1c1a17] border border-[#d4af37]/50 flex items-center justify-center text-2xl text-[#d4af37] shadow-lg group-hover:scale-110 transition-transform duration-300">
        <i class="fas fa-heart"></i>
      </div>

      <!-- النص المبارك بخط الأملس والـ Amiri الفخم -->
      <h3 class="text-2xl md:text-4xl font-bold text-[#e6dfd5] leading-relaxed mb-4" style="font-family: 'Amiri', serif;">
        "بَارَكَ اللَّهُ لَكُمَا وَبَارَكَ عَلَيْكُمَا وَجَمَعَ بَيْنَكُمَا فِي خَيْرٍ"
      </h3>

      <!-- خط فاخر ذهبي رفيع -->
      <div class="w-24 h-0.5 bg-gradient-to-r from-transparent via-[#d4af37] to-transparent mx-auto my-6"></div>

      <p class="text-sm md:text-base text-[#b5a995] font-light">
        نحمد الله الذي بنعمته تتم الصالحات، وننتظركم بفارغ الصبر لتشاركونا أفراحنا.
      </p>

    </div>

</div>
