<div class="py-20 px-4 max-w-5xl mx-auto" dir="rtl">
    
    <!-- العنوان العلوي للقسم -->
    <div class="text-center mb-16">
      <p class="text-xs md:text-sm text-[#d4af37] tracking-[0.25em] uppercase mb-2 font-light">
        OUR SWEET MEMORIES
      </p>
      <h2 class="text-3xl md:text-5xl text-[#e6dfd5] font-bold mb-3" style="font-family: 'Amiri', serif;">
        بعض ذكرياتنا
      </h2>
      <p class="text-sm md:text-base text-[#b5a995]">
        لحظات غالية وثبتت في قلوبنا معاً
      </p>
    </div>

    <!-- شبكة كولاج الصور الفاخرة -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-5 auto-rows-[160px] md:auto-rows-[180px]">
      
      @for (memory of memoriesList; track memory.imageUrl; let i = $index) {
        <!-- تمت إضافة #memoryCard هنا -->
        <div #memoryCard [class]="memory.spanClass + ' group relative bg-[#171512] border border-[#d4af37]/30 rounded-3xl overflow-hidden shadow-2xl hover:border-[#d4af37] transition-all duration-500'">
          
          <!-- حاوية الصورة مع تأثير التكبير عند الوقوف بالماوس -->
          <div class="w-full h-full overflow-hidden relative">
            <img 
              [src]="memory.imageUrl" 
              alt="Memory Photo"
              class="w-full h-full object-cover object-top group-hover:scale-105 transition-transform duration-700 ease-out"
            >
            <!-- تدرج لوني خفيف -->
            <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-4">
            </div>
          </div>

          <!-- شريحة التاريخ الثابتة في الزاوية -->
          @if (memory.date) {
            <div class="absolute top-3 right-3 z-10">
              <span class="inline-block bg-[#171512]/80 backdrop-blur-md border border-[#d4af37]/40 text-[#d4af37] text-[10px] md:text-xs px-2.5 py-0.5 rounded-full font-medium shadow-md">
                {{ memory.date }}
              </span>
            </div>
          }

        </div>
      } @empty {
        <p class="col-span-full text-center text-[#b5a995]">لا توجد ذكريات مضافة حالياً.</p>
      }

    </div>

</div>
