<div class="py-16 px-4 max-w-4xl mx-auto" #blessingCard dir="rtl">
    
    <!-- العنوان العلوي -->
    <div class="text-center mb-16">
      <p class="text-xs md:text-sm text-[#d4af37] tracking-[0.25em] uppercase mb-2 font-light">
        PROGRAM & SCHEDULE
      </p>
      <h2 class="text-3xl md:text-5xl text-[#e6dfd5] font-bold mb-3" style="font-family: 'Amiri', serif;">
        برنامج الحفل
      </h2>
      <p class="text-sm md:text-base text-[#b5a995]">
        من الساعة 8:00 مساءً وحتى 11:00 مساءً
      </p>
    </div>

    <!-- برواز الجدول الزمني الفاخر -->
    <div class="bg-[#171512] border border-[#d4af37]/30 rounded-3xl p-8 md:p-12 shadow-2xl relative">
      
      <!-- خط الزمن (Timeline Line) -->
      <div class="absolute right-10 md:right-16 top-12 bottom-12 w-0.5 bg-gradient-to-b from-[#d4af37]/80 via-[#d4af37]/30 to-transparent"></div>

      <div class="space-y-10">
        @for (event of timelineEvents; track event.title) {
          <!-- تم تغيير items-start إلى items-center لضبط الأيقونة في منتصف الكارد بالضبط -->
          <div class="relative flex items-center gap-6 md:gap-8 group">
            
            <!-- أيقونة البرواز -->
            <div class="relative z-10 w-12 h-12 md:w-14 md:h-14 rounded-2xl bg-[#1c1a17] border border-[#d4af37]/50 flex items-center justify-center text-lg md:text-xl text-[#d4af37] shadow-lg shrink-0 group-hover:border-[#d4af37] group-hover:scale-110 transition-all duration-300">
              <i [class]="event.icon"></i>
            </div>

            <!-- تفاصيل الفقرة -->
            <div class="flex-grow bg-[#1c1a17] border border-[#d4af37]/20 group-hover:border-[#d4af37]/40 transition-all duration-300 rounded-2xl p-5 md:p-6 shadow-md">
              <div class="flex flex-col md:flex-row md:items-center justify-between gap-1 mb-2">
                <h3 class="text-lg md:text-xl font-bold text-[#e6dfd5]" style="font-family: 'Amiri', serif;">
                  {{ event.title }}
                </h3>
                <span class="inline-block w-fit bg-[#25221e] border border-[#d4af37]/30 text-[#d4af37] text-xs md:text-sm px-3 py-1 rounded-full font-medium">
                  {{ event.time }}
                </span>
              </div>
              <p class="text-xs md:text-sm text-[#b5a995] leading-relaxed">
                {{ event.description }}
              </p>
            </div>

          </div>
        } @empty {
          <p class="text-center text-[#b5a995]">لا توجد بيانات متاحة حالياً.</p>
        }
      </div>

    </div>

</div>
